<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
      .calc-container {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 44px;
        width: 100%;
        max-width: 1100px;
        display: flex;
        gap: 48px;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6);
        align-items: center;
        z-index: 10;
      }
      .calc-inputs {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .calc-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }
      .calc-label {
        font-size: 20px;
        color: var(--muted);
        font-weight: 600;
      }
      .calc-val {
        font-size: 28px;
        font-weight: 800;
        color: var(--text);
      }
      .calc-result {
        flex: 1;
        background: linear-gradient(135deg, rgba(255, 85, 0, 0.15) 0%, rgba(24, 24, 27, 0.9) 100%);
        border: 1px solid rgba(255, 85, 0, 0.4);
        border-radius: 20px;
        padding: 36px;
        text-align: center;
      }
      .rev-tag {
        font-size: 16px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .rev-num {
        font-size: 72px;
        font-weight: 900;
        color: #fafafa;
        line-height: 1;
        margin-bottom: 12px;
      }
      .rev-annual {
        font-size: 20px;
        font-weight: 700;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="scene-3"
      data-width="1920"
      data-height="1080"
      data-duration="5.6"
      data-fps="30"
      class="scene-wrapper"
    >
      <div class="glow-orb"></div>
      <div class="bg-grid"></div>
      <div
        id="content"
        style="display: flex; flex-direction: column; align-items: center; width: 100%"
      >
        <div class="badge-pill"><span class="badge-dot"></span>Recoverable Pipeline Value</div>
        <h1 class="hero-title" style="font-size: 56px">
          A Fragmented Process Leaks Money.<br />A Connected System Prints It.
        </h1>
        <div class="calc-container">
          <div class="calc-inputs">
            <div class="calc-row">
              <span class="calc-label">Monthly Inquiries & DMs</span>
              <span class="calc-val" style="color: var(--accent)">50 Leads / Mo</span>
            </div>
            <div class="calc-row">
              <span class="calc-label">Average Offer Price</span>
              <span class="calc-val">$3,000</span>
            </div>
            <div class="calc-row" style="border: none">
              <span class="calc-label">Recovered Conversion Lift</span>
              <span class="calc-val" style="color: #22c55e">+3 Clients / Mo</span>
            </div>
          </div>
          <div class="calc-result">
            <div class="rev-tag">Potential Additional Revenue</div>
            <div class="rev-num">+$9,000</div>
            <div class="rev-annual">Annualized Impact: +$108,000 / Year</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline();
      tl.from("#content", { y: 30, opacity: 0, duration: 0.6, ease: "power2.out" });
      window.__timelines["scene-3"] = tl;
    </script>
  </body>
</html>
